name: Security Dataset Automation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest and dedupe dataset feed
        run: npm run security:dataset:ingest

      - name: Benchmark dataset
        run: npm run security:dataset:benchmark

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: security-benchmark-report
          path: security-benchmark-report.json
